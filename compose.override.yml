# Which inference provider/model plow-init writes into config.yaml at every
# boot. config.yaml's own model: block is NOT authoritative for this image --
# /etc/s6-overlay/scripts/plow-init.py reads HERMES_PROVIDER/HERMES_MODEL from
# the real process environment (never from the home .env -- it only ever
# WRITES specific derived keys there, it does not load arbitrary ones back
# out) and rewrites model.provider/model.default from them on every boot,
# defaulting to the Plow-hosted model when either is unset. This is the one
# way to reach that environment: agent-mgr's own compose layers this
# instance's override BEFORE its current-contract template, which reasserts
# HERMES_HOME but leaves any other key here alone.
#
# Confirmed live: with these two only in the home .env (not here), the model
# still reset to anthropic/claude-sonnet-5 under provider: plow every boot,
# with `docker exec ... printenv` showing neither variable in the container's
# actual environment at all.
#
# --- Why the image is built here -----------------------------------------
# This repo now carries its own Dockerfile (the fleet base plus the baked-in
# agent-index usage reporter), so agent-mgr must build it instead of pulling
# the fleet pin directly. agent-mgr inspects the image named by AGENT_IMAGE
# in agent.env to pick the boot contract, so the `image:` below and that
# descriptor line must be the same tag -- a mismatch boots one image under
# another's derivation, silently. Same pattern as
# the-plow-times-hermes-agent's compose.override.yml.
#
# The build context is ${AGENT_DIR}, never `.`: agent-mgr runs
# `docker compose -f <this file> build` without changing directory, so a
# relative context resolves against agent-mgr's own directory, not this
# repo. `pull_policy: never` is required -- without it a registry image
# could be pulled over the local build and run with the agent's
# credentials. Build with `agent-mgr compose memory-vault build`, then
# `agent-mgr restart`.
services:
  hermes:
    build: { context: "${AGENT_DIR}" }
    image: ${AGENT_IMAGE}
    pull_policy: never
    environment:
      - HERMES_PROVIDER=openrouter
      - HERMES_MODEL=meta/muse-spark-1.3-contributor
