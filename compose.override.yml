# Every skill folder mounts read-only into /opt/data/skills/<name>, sourced
# from ${AGENT_DIR} (set by agent-mgr from the registry entry, never a
# relative path). Two non-skill binds: runtime/SOUL.md, pinned read-only
# over the gateway's own default persona; and family_profile.json, the
# operator's real family data, kept outside git (see .gitignore) and
# mounted read-only so no skill script can alter it.
services:
  hermes:
    volumes:
      - ${AGENT_DIR:?set by agent-mgr from the registry}/fm-shared:/opt/data/skills/fm-shared:ro
      - ${AGENT_DIR:?set by agent-mgr from the registry}/fm-planner:/opt/data/skills/fm-planner:ro
      - ${AGENT_DIR:?set by agent-mgr from the registry}/fm-shopping:/opt/data/skills/fm-shopping:ro
      - ${AGENT_DIR:?set by agent-mgr from the registry}/fm-homework:/opt/data/skills/fm-homework:ro
      - ${AGENT_DIR:?set by agent-mgr from the registry}/fm-agenda:/opt/data/skills/fm-agenda:ro
      - ${AGENT_DIR:?set by agent-mgr from the registry}/runtime/SOUL.md:/opt/data/SOUL.md:ro
      - ${AGENT_DIR:?set by agent-mgr from the registry}/family_profile.json:/opt/data/mm/family_profile.json:ro
