# Every skill folder mounts read-only into /opt/data/skills/<name>, sourced
# from ${AGENT_DIR} (set by agent-mgr from the registry entry, never a
# relative path). The one non-skill bind is runtime/SOUL.md, pinned
# read-only over the gateway's own default persona. Saved-content memory
# (facts, the raw image cache) has no bind of its own -- it lives under
# /opt/data, which already persists across restarts as part of the agent's
# normal state (same place state.db and sessions already live).
services:
  hermes:
    volumes:
      - ${AGENT_DIR:?set by agent-mgr from the registry}/ingerir_conteudo:/opt/data/skills/ingerir_conteudo:ro
      - ${AGENT_DIR:?set by agent-mgr from the registry}/runtime/SOUL.md:/opt/data/SOUL.md:ro
