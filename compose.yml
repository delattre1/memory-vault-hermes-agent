# This agent's runtime surface, in the shape plow-agents' compose.example.yml
# defines. This repository owns it from here.
#
# compose.override.yml is gone on purpose: Docker Compose loads that filename
# automatically, and two compose files would start two gateways against one
# home. Skills are baked into the image (Dockerfile COPY to /opt/hermes/skills),
# not mounted.
services:
  agent:
    build: .
    environment:
      # Who this agent is on the Agent Index. Without it the reporter stands
      # down rather than guessing a name.
      AGENT_ID: memory-vault
    volumes:
      # `.host`, not the path the agent reads: a bind carries this machine's
      # ownership in, and the image copies the file into place as root itself.
      - ./plow-credentials:/var/lib/plow/credentials.host:ro
      # The agent's home, kept across `up`/`down` for its sessions and setup.
      # Persona lives in the image seed (`plow-seed/SOUL.md`); a rebuild
      # publishes it. `docker compose down -v` wipes sessions and the fact
      # store — only for a deliberate fresh start, never to pick up SOUL.md.
      - agent-home:/var/lib/hermes
    # The agent checkpoints its session on SIGTERM and its supervisor allows
    # 30s for that, so Docker's own deadline has to sit outside that one.
    stop_grace_period: 35s

volumes:
  agent-home:
