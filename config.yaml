# The declarative half of this agent's home -- everything that is a deliberate
# choice for this deployment. Keys equal to the image's own defaults are
# deliberately absent, so the pinned image supplies its current defaults rather
# than a frozen snapshot of them.
#
# _config_version pinned to the base image's own seed
# (/opt/hermes/plow-seed/config.yaml inside the container, same value at its
# end) -- without it, this file has no version at all, which the image's
# config-migrate step treats as "too old to migrate" and silently falls back
# to the seed's own defaults for anything this file also sets, model included
# (confirmed live: model: google/gemini-2.5-flash-lite/openrouter below never
# took effect until this line was added -- every boot kept resetting to
# anthropic/claude-sonnet-5/plow instead, with a "predates version 12" warning
# in `docker logs` as the only clue).
_config_version: 37
# One session per group chat, shared by every participant. Present despite the
# "absent keys mean image defaults" rule above: the image default (true) splits
# a group thread into per-sender sessions, and the plow-chat plugin's
# config.extra flag never reaches the gateway session store.
group_sessions_per_user: false
model:
  default: google/gemini-2.5-flash-lite
  provider: openrouter
# Saved-content memory backend: the built-in holographic fact store (SQLite,
# local, no API key -- confirmed reading the plugin source inside the image).
# Not a service we run; the plugin ships with Hermes and activates on this
# key alone. See docs/superpowers/specs/2026-09-03-jessie-content-memory-pivot-design.md, §6.
memory:
  provider: holographic
mcp_servers:
  # Plow Latch, reached over the Plow relay: the browser and filesystem this
  # agent works on are the operator's Mac, not this container. The relay
  # authorises the connection and tells the Mac who is asking; the Mac
  # authorises each action. Both values come from the agent's own dotenv, so
  # the credential never appears in this file or in a URL in git.
  #
  # THIS BLOCK IS THE DECLARATION. An agent that drives no Mac deletes it --
  # leaving it in place with blank DOMO_* values is a configured latch with no
  # credential, which is a broken agent rather than an unconfigured one, and
  # `agent-mgr check-latch` says so.
  #
  # Baseline rather than optional because most agents want it: a new one is
  # wired for Latch and you remove this if it drives nothing.
  latch:
    url: https://api.plow.co/v1/relay/devices/${DOMO_DEVICE_UID}/mcp
    headers:
      Authorization: Bearer ${DOMO_MCP_TOKEN}
    enabled: true
plugins:
  enabled:
  - plow-chat-platform
  entries:
    plow-chat-platform:
      # The plugin registers one platform and no tools. Denying overrides keeps
      # a future plugin change from silently shadowing an image tool of the
      # same name, which would be invisible from this file.
      allow_tool_override: false
  # Saved-content memory backend config (the provider itself is activated by
  # memory.provider above; this only sets its one non-default knob).
  hermes-memory-store:
    db_path: ${HERMES_HOME}/memory_store.db
platforms:
  plow_chat:
    enabled: true
# Structural fix, not a prompt one: a smaller model (google/gemini-2.5-flash-lite)
# kept reaching for web_extract/browser_exec instead of Latch for a link,
# even after the persona explicitly forbade it -- prompting alone hit its
# ceiling (findings.md has two earlier, narrower cases of the same pattern).
# Removing "web" and "browser" from the allowed toolset removes the choice
# entirely: nothing but `latch`'s own MCP tools can fetch a page anymore.
# Every other entry here is the image's own default set, copied so this
# stays an allowlist-minus-two rather than a hand-maintained one that could
# silently drift from the image's actual defaults.
platform_toolsets:
  cli:
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - kanban
    - memory
    - plow_chat
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
  plow_chat:
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - hermes-plow_chat
    - image_gen
    - kanban
    - memory
    - plow_chat
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
